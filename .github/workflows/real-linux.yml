name: real-linux

# Not a CI gate: runs only on manual dispatch, or when a branch named real-linux/** is pushed (master, feature branches and PRs never trigger it).
on:
  workflow_dispatch:
  push:
    branches: ['real-linux/**']

permissions:
  contents: read

jobs:
  real-linux:
    name: real-linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Record the runner kernel
        # The BPF objects are proven only on the kernels these runs use; the
        # notice annotation is public, so the version is recorded per run.
        run: |
          uname -a
          echo "::notice title=runner kernel (${{ matrix.os }})::$(uname -r)"
      - uses: dtolnay/rust-toolchain@stable
      - name: Choose the BPF object dir
        # setup.sh builds the BPF objects here (process.bpf.o since 11b-1,
        # net.bpf.o since 11b-2) and every stack's agent loads them
        # (render::bpf_dir_from_env).
        run: echo "OSIRIS_BPF_DIR=$RUNNER_TEMP/osiris-bpf" >> "$GITHUB_ENV"
      - name: Prepare auditd, watch dirs and the BPF objects
        # A BPF build failure is annotated by setup.sh (annotate.sh tail).
        run: sudo "OSIRIS_BPF_DIR=$OSIRIS_BPF_DIR" tools/real-linux/setup.sh
      - name: Start DNS packet capture
        # Diagnostic only (Phase 11a): every UDP/53 packet during the suite,
        # for post-mortems and the replay fixture. A capture failure warns
        # and never blocks the suite. -U flushes per packet; -Z root keeps
        # write access to the runner-owned artifacts dir.
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          sudo nohup tcpdump -Z root -U -i any -w "$RUNNER_TEMP/artifacts/dns.pcap" udp port 53 \
            > "$RUNNER_TEMP/artifacts/tcpdump.log" 2>&1 &
          sleep 2
          pgrep -x tcpdump >/dev/null || echo "::warning::tcpdump is not running: $(cat "$RUNNER_TEMP/artifacts/tcpdump.log")"
      - name: Run the real-Linux suite as root
        id: suite
        # Build ~5 min + suite ~2 min; a hang fails here, not at the job cap.
        timeout-minutes: 80
        # Root needs the runner's toolchain: keep PATH and cargo/rustup homes.
        # TMPDIR makes the harness's kept stack dirs findable for the artifact.
        # --nocapture keeps the eBPF scenarios' `osiris-ebpf:` status lines.
        run: |
          mkdir -p "$RUNNER_TEMP/osiris-kept"
          sudo chmod 1777 "$RUNNER_TEMP/osiris-kept"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" \
            "TMPDIR=$RUNNER_TEMP/osiris-kept" CARGO_TARGET_DIR=/root/osiris-target \
            "OSIRIS_BPF_DIR=$OSIRIS_BPF_DIR" \
            tools/real-linux/ab-loop.sh 15 "$RUNNER_TEMP/artifacts" 2>&1 | tee "$RUNNER_TEMP/real-linux-output.txt"
          exit "${PIPESTATUS[0]}"
      - name: Annotate suite failures
        # Annotations are public; job logs and artifacts need GitHub auth.
        if: always() && steps.suite.outcome == 'failure'
        run: tools/real-linux/annotate.sh failures "real-Linux suite failed" "$RUNNER_TEMP/real-linux-output.txt"
      - name: Annotate the eBPF backends' status (process, network and filesystem)
        # Kept stack dirs are root-only, hence sudo.
        if: always() && steps.suite.outcome != 'skipped'
        run: sudo tools/real-linux/annotate.sh ebpf "$RUNNER_TEMP/real-linux-output.txt" "$RUNNER_TEMP/osiris-kept"
      - name: Stop DNS packet capture
        if: always()
        # SIGINT lets tcpdump finish the pcap; bounded wait for it to exit.
        run: |
          sudo pkill -INT -x tcpdump || true
          for _ in $(seq 1 20); do pgrep -x tcpdump >/dev/null || break; sleep 0.5; done
          sudo pkill -KILL -x tcpdump || true
      - name: Run the DNS sensor's unit tests on Linux
        id: dns_unit
        # The Linux-only tests (cBPF program, AF_PACKET dispositions, the
        # /proc symlink attribution cases) can only run here. No root needed.
        if: always()
        timeout-minutes: 15
        run: |
          cargo test -p osiris-sensors-dns -- --include-ignored 2>&1 | tee "$RUNNER_TEMP/dns-unit-tests.txt"
          exit "${PIPESTATUS[0]}"
      - name: Annotate DNS unit test failures
        if: always() && steps.dns_unit.outcome == 'failure'
        run: tools/real-linux/annotate.sh failures "DNS unit tests failed" "$RUNNER_TEMP/dns-unit-tests.txt"
      - name: Run the process and network sensors' and eBPF engine's unit tests on Linux
        id: ebpf_unit
        # Phase 11b-1: the Linux-only tests (e.g. the /proc/<pid>/exe symlink
        # case resolved_proc_exe_wins_over_the_filename, the loader and
        # probe tests; since 11b-2 the network sensor's eBPF wiring and the
        # exe-identity symlink cases) can only run here. No root needed.
        if: always()
        timeout-minutes: 15
        # The fs_object_loads_and_attaches* tests (tests/load_fs.rs) need root: skipped
        # here, run by the next step.
        run: |
          cargo test -p osiris-sensors-process -p osiris-sensors-net -p osiris-sensors-fs -p osiris-ebpf -- --include-ignored \
            --skip fs_object_loads_and_attaches 2>&1 \
            | tee "$RUNNER_TEMP/process-ebpf-unit-tests.txt"
          exit "${PIPESTATUS[0]}"
      - name: Annotate process/network/eBPF unit test failures
        if: always() && steps.ebpf_unit.outcome == 'failure'
        run: tools/real-linux/annotate.sh failures "process/network/eBPF unit tests failed" "$RUNNER_TEMP/process-ebpf-unit-tests.txt"
      - name: Load the fs BPF object as root
        id: fs_load
        # Phase 11b-3: proves the verifier accepts fs.bpf.o on this kernel,
        # that its programs attach, that one watched create is emitted, that
        # the agent's own operations are filtered in the kernel, and that the
        # walk sees a watched dir past a chroot and through a detached mount.
        # Serial (--test-threads=1): the chroot test changes the process root
        # for a moment. Root's own target dir, as in the suite step.
        # --nocapture keeps the skipped attach points and verifier lines.
        if: always()
        timeout-minutes: 15
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" \
            CARGO_TARGET_DIR=/root/osiris-target "OSIRIS_BPF_DIR=$OSIRIS_BPF_DIR" \
            cargo test -p osiris-ebpf --test load_fs -- --include-ignored --test-threads=1 --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/fs-load-test.txt"
          status="${PIPESTATUS[0]}"
          # Public notice: skipped attach points, verified-instruction
          # counts and the events seen (at most 7 lines).
          grep -h 'osiris-ebpf: fs' "$RUNNER_TEMP/fs-load-test.txt" | cut -c1-900 \
            | while IFS= read -r line; do echo "::notice title=fs load (${{ matrix.os }})::$line"; done
          exit "$status"
      - name: Annotate fs load test failures
        # The tail carries the end of a verifier log.
        if: always() && steps.fs_load.outcome == 'failure'
        run: |
          tools/real-linux/annotate.sh failures "fs BPF load test failed" "$RUNNER_TEMP/fs-load-test.txt"
          tools/real-linux/annotate.sh tail error "fs BPF load test output (tail)" "$RUNNER_TEMP/fs-load-test.txt" 60
      - name: Collect audit log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          sudo cp /var/log/audit/audit.log "$RUNNER_TEMP/artifacts/audit.log" || true
          sudo chmod -R a+rX "$RUNNER_TEMP/artifacts" || true
          cp "$RUNNER_TEMP/real-linux-output.txt" "$RUNNER_TEMP/artifacts/" || true
          cp "$RUNNER_TEMP/dns-unit-tests.txt" "$RUNNER_TEMP/artifacts/" || true
          cp "$RUNNER_TEMP/process-ebpf-unit-tests.txt" "$RUNNER_TEMP/artifacts/" || true
          cp "$RUNNER_TEMP/fs-load-test.txt" "$RUNNER_TEMP/artifacts/" || true
          sudo cp -r "$OSIRIS_BPF_DIR" "$RUNNER_TEMP/artifacts/bpf" || true
          sudo cp -r "$RUNNER_TEMP/osiris-kept" "$RUNNER_TEMP/artifacts/kept-stack-dirs" || true
          sudo chmod -R a+rX "$RUNNER_TEMP/artifacts" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-linux-${{ matrix.os }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
