[package]
name = "osiris-storage"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
osiris-schema = { path = "../osiris-schema" }
osiris-query = { path = "../osiris-query" }
thiserror = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
# Backend-neutral `Storage` conformance suite (`osiris_storage::conformance`),
# run by each backend's own integration tests.
conformance = ["dep:serde_json"]
